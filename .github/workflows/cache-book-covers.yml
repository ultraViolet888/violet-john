name: Cache personal book covers

on:
  push:
    branches:
      - feature/cache-personal-book-covers
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run importer tests
        run: python -m unittest discover -s tests -p 'test_book_covers.py'
      - name: Download missing book covers and update HTML
        run: python tools/cache_book_covers.py
      - name: Commit downloaded covers to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/books
          if ! git diff --cached --quiet; then
            git commit -m "Cache available personal book covers locally"
            git push
          fi

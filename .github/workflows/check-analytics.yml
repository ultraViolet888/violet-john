name: Check visitor analytics

on:
  pull_request:
    paths:
      - "analytics.js"
      - "script.js"
      - "index.html"
      - "tools/export_analytics.py"
      - "tests/test_analytics_export.py"
      - ".github/workflows/*analytics*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check analytics.js
          node --check script.js

      - name: Test safe analytics aggregation
        run: python3 -m unittest discover -s tests -p "test_analytics_export.py"
